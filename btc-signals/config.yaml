# BTC Up/Down signal app configuration. Secrets go in .env, never here.

server:
  host: 127.0.0.1
  port: 8000
  https: false        # true (or run with --https) if your browser forces https even for localhost
  keep_awake: true    # stop the computer idle-sleeping while the bot runs (Windows/macOS/Linux)
  open_browser: true  # open the dashboard in the default browser on start (--no-browser to skip)

db_path: data/signals.db

# Which exchange to trade:
#   polymarket_us   - Polymarket US (CFTC-regulated, for US residents; KYC + API key)
#   polymarket_intl - polymarket.com (blocks US users)
venue: polymarket_us

polymarket_us:
  gateway_url: https://gateway.polymarket.us     # public market data, no key
  api_url: https://api.polymarket.us             # trading (signed with your API key)
  durations: [5m, 15m]
  discovery_interval_s: 5
  book_poll_interval_s: 1
  taker_fee_theta:                 # blank = use each market's feeCoefficient (0.095 today;
                                   # 0.0695 for your first 7 days - set 0.0695 then if you like)

# ---------------------------------------------------------------------------
# Price feeds. Every source implements the same PriceFeed interface
# (app/feeds/base.py). Swap or reorder sources here; no code changes needed.
#   type: one of polymarket_rtds | polybolt | coinbase | kraken | binance
# "reference" = the resolution source (Chainlink). Tried in order; the first
#   healthy one is used. If none are healthy, the app falls back to a
#   synthetic 60s TWAP built from spot and marks data DEGRADED (NO TRADE).
# "spot" = exchange trades used for candles, momentum, VWAP, order flow and
#   as the cross-check against Chainlink. First healthy one is primary.
# ---------------------------------------------------------------------------
feeds:
  reference_us:                    # used when venue: polymarket_us (settles on CF Benchmarks BRTI)
    - type: polymarket_us_brti
      url: https://gateway.polymarket.us/v1/asset-prices/history
      poll_interval_s: 1
      no_price_after_s: 6
  reference:                       # used when venue: polymarket_intl (settles on Chainlink)
    - type: polymarket_rtds        # legacy RTDS, no auth, deprecated by Polymarket
      url: wss://ws-live-data.polymarket.com
    - type: polybolt               # replacement; needs POLY_API_KEY/SECRET/PASSPHRASE in .env
      url: wss://ws-live-v2.polymarket.com/ws
  spot:
    - type: coinbase
      url: wss://ws-feed.exchange.coinbase.com
      symbol: BTC-USD
      no_price_after_s: 20         # trades can pause; heartbeats prove the socket is alive
      frozen_after_s: 120
    - type: kraken
      url: wss://ws.kraken.com/v2
      symbol: BTC/USD
      no_price_after_s: 45         # Kraken BTC/USD prints less often than Coinbase
      frozen_after_s: 180
    # - type: binance              # geo-blocked in the US
    #   url: wss://stream.binance.com:9443/ws
    #   symbol: btcusdt

  health:
    # Defaults; any feed entry above can override these per source.
    stale_after_s: 5               # no message at all (incl. heartbeats) -> not responding
    no_price_after_s: 5            # no price tick for this long -> stale
    max_lag_s: 5                   # exchange timestamp older than this -> stale
    frozen_after_s: 30             # price unchanged for this long -> stale (frozen feed)
    warn_repeat_s: 60              # repeat the stale warning this often while it lasts
    reconnect_max_backoff_s: 30

# Chainlink vs spot cross-check. Exceeding any of these -> DEGRADED -> NO TRADE.
data_quality:
  max_gap_bps: 15                  # |chainlink - spot median| in basis points
  gap_persist_s: 3                 # gap must persist this long before tripping
  recover_after_s: 10              # gap must be back under threshold this long to clear
  require_two_spot_sources: false  # if true, one spot feed down => degraded
  max_spot_disagreement_bps: 15    # coinbase vs kraken disagreement => degraded

polymarket:
  gamma_url: https://gamma-api.polymarket.com
  clob_url: https://clob.polymarket.com
  clob_ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  data_api_url: https://data-api.polymarket.com
  # display-only cross-check (Chainlink spot at the boundary; NOT the resolution price)
  site_price_url: https://polymarket.com/api/crypto/crypto-price
  durations: [5m, 15m]
  discovery_interval_s: 15
  # Expected rules template. Any market that differs is flagged and forced to NO TRADE.
  expected_rules:
    twap_enabled: true
    twap_lookback_seconds: [60]
    resolution_mechanism: oracle
    source_contains: chain.link
    comparator_phrase: "greater than or equal to"

model:
  path_5m: models/model_5m.json
  path_15m: models/model_15m.json
  vol_halflife_s: 900              # EWMA half-life for realised vol
  vol_step_s: 60                   # estimate vol from 60s returns (1s returns understate it ~6x)
  min_vol_per_s: 0.00002           # floor on sigma (log-return per sqrt(second))

signal:
  buffer: 0.04                     # required edge on top of fees + spread/slippage
  stake_usd: 50                    # size used to walk the book for slippage
  max_spread: 0.04
  min_seconds_left: 10
  max_seconds_left_5m: 290
  max_seconds_left_15m: 880
  eval_interval_s: 1
  max_entries_per_window: 1

exits:
  eval_interval_s: 2
  hold_buffer: 0.01                # SELL if bid >= fair - hold_buffer (edge gone)
  stop_threshold: 0.15             # SELL if fair < entry - stop_threshold
  take_profit: 0.20                # consider locking profit if bid >= entry + take_profit
  lock_remaining_ev: 0.03          # ...and remaining EV of holding < this

news:
  enabled: true
  poll_interval_s: 60
  feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
    - https://www.theblock.co/rss.xml
  sentiment_halflife_min: 30
  shock_confidence: 0.8            # a headline at/above this confidence...
  shock_block_min: 5               # ...blocks new signals for this many minutes

calendar:
  enabled: true
  feed_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
  refresh_interval_s: 3600
  local_file: events.yaml          # manual additions / overrides
  countries: [USD]
  impacts: [High]
  blackout_before_min: 5
  blackout_after_min: 10

derivatives:
  enabled: true
  provider: hyperliquid            # hyperliquid | binance
  poll_interval_s: 10
  hyperliquid_url: https://api.hyperliquid.xyz/info
  binance_url: https://fapi.binance.com

paper:                              # signal log: every signal as a $50 hypothetical trade
  enabled: true
  stake_usd: 50

# ---------------------------------------------------------------------------
# Auto-trader. PAPER by default: simulated fills against the real order book.
# LIVE needs ALL of: mode: live, live_trading_enabled: true, >= min_paper_trades_for_live
# closed paper trades, Python 3.11+ with polymarket-client, keys in .env, an eligible
# location (Polymarket blocks the US), and the confirmation phrase typed at startup.
# ---------------------------------------------------------------------------
trading:
  enabled: true
  mode: paper                      # 2026-11-10: bot reworked into a COPY-TRADING bot, paper first (was live: fair-value crypto)
  live_trading_enabled: false      # second, explicit switch for live (was true for the crypto strategy)
  min_paper_trades_for_live: 0     # was 300; waived by the user on 2026-11-09 (crypto only, phase-1 caps)
  paper_count_from: "2026-11-09T23:52:00Z"   # new fair-value strategy: only its paper trades count
  live_phase: 1                    # first live phase: hard caps in app/trading/live_phase.py
                                   # ($1 stake, $10/day loss, 10 live trades/day; config can only lower them)
  live_phase1:
    max_trades_per_day: off        # user's choice 2026-11-10: no daily trade cap (was 10; can't be set above 10)
  reconcile_interval_s: 60         # compare bot vs exchange positions/orders; mismatch twice -> halt
  log_file: data/trader.log
  balance_check_s: 30
  strategy: fair_value             # settlement-math strategy (app/modules/crypto_fair.py)
  entry:
    stake_pct: 0.10                # each fair-value trade = 10% of current buying power (user 2026-11-10)
    stake_usd: off                 # (fixed-dollar stake, used only if stake_pct is off)
    order_timeout_s: 3             # cancel an unfilled limit entry after 3 s; the next book update
                                   #   re-checks the edge and re-quotes if it is still there (was 10 s)
    event_driven: true             # check entries on every order-book update (websocket), not on a timer
    min_signal_gap_s: 0.05         # ... at most every 50 ms
    entry_latency_alert_ms: 300    # alert if median book update -> buy order exceeds this
    reentry_cooldown_s: 20
    max_entries_per_window: 1      # one fair-value position per window
  exits:
    check_interval_s: 1            # exits: bid (after fees) vs fair; no % stop / take-profit
    fast_check_interval_s: 0.25    # with an open position: check exits every 250 ms
    profit_lock_price: 0.95        # resting SELL for the whole position, placed when it opens, at
    profit_lock_offset: 0.25       #   max(entry + 25c, fair value + 3c), capped at 95c; moved as fair
    profit_lock_fair_margin: 0.03  #   value changes (2+ ticks, at most every 3 s). Was min(entry + 10c, 96c).
    profit_lock_reprice_ticks: 2
    profit_lock_reprice_s: 3
    profit_take_gain: off          # (was: bid >= entry + 6c and edge < 3 points -> sell; removed 2026-11-10)
    profit_take_max_edge: 0.03
    sell_if_fair_below: 0.30       # true probability of the held side < 30%: sell at the bid, don't ride to zero
    lock_in_bid: 0.93              # bid >= 93c: sell now ...
    lock_in_hold_above: 0.99       # ... unless the averaging window has started and fair > 99%
    late_exit_s_5m: 45             # profitable and < 45 s left (5m) / < 90 s (15m) ...
    late_exit_s_15m: 90
    late_exit_min_bid: 0.85        # ... and bid >= 85c: sell
    latency_alert_ms: 1000         # alert if the median price->sell-order time exceeds this
    exit_slippage_ticks: 0         # sell limit = best bid (never below it, never into an empty book)
    exit_order_timeout_s: 3
  risk:
    max_stake_usd: off             # no fixed $ cap: the 10% stake scales with the balance (was $1)
    daily_loss_limit_usd: off      # user's choice 2026-11-10: no automatic stops - only STOP ends trading
    max_consecutive_losses: off    # (was: $10/day, 4 losses in a row -> stop for the day)
    losing_streak_action: stop_for_day   # ... stop for the rest of the day (auto-resume after midnight)
    max_total_exposure_usd: off    # open positions + orders <= 50% of buying power instead of a fixed $5
    max_total_exposure_pct: 0.50
    min_wallet_balance_usd: off    # no halt on low balance: entries are just skipped while buying power < stake
    max_api_errors: 3              # this many errors...
    api_error_window_s: 300        # ...within this window -> pause
  self_check:
    enabled: off                   # user's choice 2026-11-10: report only, never pauses (was: pause after 100)
    after_trades: 100              # then every 25 trades: pause if calibration is poor or P&L < 0
    every: 25
    max_calibration_error: 0.10    # average |predicted - actual| over probability buckets

fair_value:                        # PART 1-4 settings (calibrated 2026-11-09 on BRTI + spot history)
  sigma_step_s: 30                 # volatility from 30 s price changes over the last 30 min
  sigma_lookback_s: 1800
  vol_mult: 1.15
  dist: t                          # fat tails (Student-t, 4 degrees of freedom)
  nu: 4
  basis_halflife_s: 600            # spot -> BRTI basis (EWMA)
  min_edge: 0.05                   # fair - ask - taker fee, 15-minute markets
  take_ask_edge: 0.08              # edge >= 8 points: buy AT the ask (fills now); smaller: one tick under
  five_min_multiplier: 2.0         # 5-minute markets need 2x the edge
  min_price: 0.55                  # only buy a side priced 55c-93c: no long shots (live losses 2026-11-09;
  max_price: 0.93                  #   the model overestimates cheap sides). Arbitrage is the only exception.
  no_entry_last_s: 5
  max_index_age_s: 6               # data blocks: BRTI feed older than this
  max_spot_age_s: 5                # spot feed older than this
  max_spot_disagree_bps: 15        # Coinbase vs Kraken
  max_book_age_s: 5
  max_vol_ratio: 3.0               # volatility > 3x its 6-hour median = abnormal
  warmup_s: 1800                   # 30 min of live spot before trading = the full volatility look-back.
                                   # With ~10 min after a restart, one sharp dip inflated volatility
                                   # (~6.3 vs ~4.7 $/sqrt s) and let a 7c long shot through (Nov 9, 8:15 PM).
  flip_window_s: 10                # emergency exit: fair fell >= flip_drop within 10 s ...
  flip_drop: 0.35
  flip_floor: 0.15                 # ... to <= 15%
  arb_min_profit: 0.01             # PART 4 watcher threshold ($ per pair)
alerts:
  sound: true
  desktop: true

# Phone push notifications. Set NTFY_TOPIC (or TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID) in .env.
notifications:
  enabled: true
  ntfy_server: https://ntfy.sh
  # which alerts to push: signal (new trade signal), exit (SELL/HOLD change on your positions),
  # degraded (data went bad / recovered), rules (market rules changed), settled (window results)
  kinds: [signal, exit, degraded, rules, trade, risk, error, summary]
  # in LIVE mode trade (every fill), risk (limits, mismatch, kill switch), error and summary are always on
  daily_summary_at: "23:55"        # local time: trades, P&L after fees, win rate, avg win/loss, sports CLV
  min_interval_s: 2
  click_url: ""                    # optional: link opened when you tap the notification

# ---------------------------------------------------------------------------
# Strategy modules (shared executor, risk, kill switch, paper/live, logging)
# ---------------------------------------------------------------------------
modules:
  crypto_updown: {enabled: false}  # ARCHIVED 2026-11-10 (copy trading replaces it); code kept, set true to run it again

# The BTC 5m/15m prediction pipeline (price feeds, models, signal alerts). ARCHIVED for copy trading:
# false = none of it runs (code kept). true = run it again (also needs modules.crypto_updown.enabled).
predictions:
  enabled: false

# ---------------------------------------------------------------------------
# COPY TRADING (2026-11-10). Watches the approved traders on international Polymarket (public data,
# read-only; the user accepted that reading it from the US conflicts with polymarket.com's terms) and copies
# their trades onto POLYMARKET US ONLY. PAPER ONLY in this build: no real orders whatever trading.mode says.
# Kill switch / STOP button / stop-bot.bat, logging and Windows sleep protection work exactly as before.
# ---------------------------------------------------------------------------
copytrade:
  enabled: true
  mode: paper
  traders:                         # approved by the user 2026-11-10 for PAPER copying (audit verdict: weak)
    - {name: ArielFilipino, wallet: "0xe18ecc345e00ee7c4f2d1f676f3dd2acb112f826"}   # NFL/CFB/NBA spreads, totals
    - {name: rigatohni, wallet: "0x12e45413131aedc46b68a127354831300485dfc2"}       # US election markets
  poll_interval_s: 3               # how often each trader's new fills are read
  stake_usd: 1.0                   # $ per copied trade
  max_worse: 0.03                  # copy a buy only if the US price is <= their price + 3c
  min_exit_depth_usd: 5            # ... and at least $5 of buyers within exit_band of the ask (so we can get out)
  exit_band: 0.05
  max_spread: 0.05                 # ... and the US bid/ask spread is <= 5c
  max_per_market_usd: 3            # at most $3 in any single market
  min_time_to_resolution_s: 3600   # don't copy markets that resolve in under 1 hour
  max_signal_age_s: 300            # their trade must be seen within 5 min (data feed lag)
  opposite_side_window_s: 604800   # skip if another approved trader bought the other side within 7 days
  politics_min_confidence: 0.95    # strict election-market matcher: below this, not copied
  pause_after_trades: 30           # auto-pause a trader whose copies lost money after 30 closed copies
  rescore_every_days: 7            # weekly re-score of each trader (alert if their last 30 days lost money)
  sell_retry_s: 900                # a copied sale with no buyers is retried for 15 min, then held to resolution
  book_poll_s: 2
  paper_count_from: "2026-11-10T00:00:00Z"
  entry:
    stake_usd: 1.0
    order_timeout_s: 5             # buy limit rests up to 5 s, the rest is canceled
    allow_stacking: true           # each copy is its own position (the $3/market cap above still applies)
  exits:
    check_interval_s: 1
    exit_slippage_ticks: 1         # copied sells: limit 1 tick under the best bid
    exit_order_timeout_s: 5
  risk:
    max_stake_usd: 1.0
    max_total_exposure_usd: 10     # all open copies + orders <= $10
    max_consecutive_losses: 5      # 5 losing copies in a row -> STOP copying + alert (press Resume to continue)
    losing_streak_action: pause
    daily_loss_limit_usd: off
    min_wallet_balance_usd: off
    max_api_errors: 3
    api_error_window_s: 300

risk_global:                       # across ALL modules
  daily_loss_limit_usd: off      # no combined daily stop either
  max_total_exposure_usd: off    # per-module % caps apply

sports:                            # Polymarket US sports (needs venue: polymarket_us)
  enabled: false                   # ARCHIVED 2026-11-10 (copy trading replaces it); code kept
  live_enabled: false              # LIVE also needs trading.mode: live and 200 paper sports trades
  min_paper_trades_for_live: 200
  leagues:                         # Polymarket US league slugs; buffer = required edge per league
    nfl: {enabled: true, buffer: 0.07}
    nba: {enabled: true, buffer: 0.07}
    nhl: {enabled: true, buffer: 0.07}
    epl: {enabled: true, buffer: 0.07}
    mlb: {enabled: false, buffer: 0.07}
    cfb: {enabled: false, buffer: 0.08}
    cbb: {enabled: false, buffer: 0.08}
    mls: {enabled: false, buffer: 0.08}
    ucl: {enabled: false, buffer: 0.07}
  bet_types: [moneyline, spread, total]     # no props
  edge_buffer: 0.07                # default buffer (free odds are delayed)
  no_entry_before_start_min: 15    # no entries in the last 15 min unless Pinnacle confirms
  live_betting: false              # no in-game trading
  lookahead_hours: 36
  event_refresh_s: 600
  book_refresh_s: 60
  eval_interval_s: 15
  gateway_concurrency: 4
  liquidity: {max_spread: 0.03, min_depth: 200}
  entry:
    stake_usd: 1                   # small account (was 5)
    order_style: maker
    order_timeout_s: 60
    max_entries_per_window: 1      # per market
    reentry_cooldown_s: 900
  exits:
    check_interval_s: 1
    take_profit_pct: 0.10          # sell at +10% after fees...
    fair_buffer: 0.0               # ...or when the bid nets >= fair value
    stop_fair_drop: 0.05           # sell if fair value falls 5 pts below fair at entry
    stop_loss_pct: 0.25            # (display only for sports; the fair-value stop is the rule)
    sell_before_start_min: 5       # at start: hold if edge persists, otherwise sell before start
    hold_if_edge: true
    hold_min_edge: 0.02
    exit_slippage_ticks: 2
    exit_order_timeout_s: 5
  risk:                            # small account (was 10 / 30 / 40 / 15 / 40 / 10)
    max_stake_usd: 1
    daily_loss_limit_usd: 1
    max_total_exposure_usd: 2
    max_exposure_per_game_usd: 1   # every position in one game counts as one exposure
    max_exposure_per_league_usd: 2
    max_consecutive_losses: 6
    min_wallet_balance_usd: 1
    max_api_errors: 5
    api_error_window_s: 600
  odds:
    method: power                  # de-vig: power | multiplicative
    min_books: 2
    max_quote_age_s: 2700
    sharpapi_refresh_s: 120
    schedule:                      # TheRundown refresh cadence per league (data-point budget)
      far_refresh_s: 10800
      near_window_h: 2
      near_refresh_s: 1800
      closing_capture_min: 10
      closing_refresh_s: 600
      idle_refresh_s: 14400
    pinnacle_check: {window_min: 60, max_disagree: 0.03}
    sources:
      therundown:                  # free: 20k/day + 200k/month data points, 5-min delay
        enabled: true
        key_env: THERUNDOWN_API_KEY
        min_interval_s: 1.2
        budget: {day: 18000, month: 190000, reserve: 1500}
      sharpapi:                    # free: 12 req/min, 60-s delay, DraftKings + FanDuel
        enabled: true
        key_env: SHARPAPI_KEY
        min_interval_s: 6
        max_pages: 4
        budget: {}
      theoddsapi:                  # free: 500 credits/month; Pinnacle checks only
        enabled: true
        key_env: THE_ODDS_API_KEY
        min_interval_s: 1.5
        budget: {month: 500, reserve: 25}
  research:
    injuries_ttl_s: 600
    news_ttl_s: 300
    weather: true
